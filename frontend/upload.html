<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RecruitFlow - Upload Resume</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">
<i class="fa-solid fa-user-tie"></i>
RecruitFlow
</a>

</div>

</nav>



<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8 col-lg-6">


<div class="card shadow-lg">


<div class="card-header bg-primary text-white">

<h3>
<i class="fa-solid fa-upload"></i>
Upload Resume
</h3>

</div>



<div class="card-body">


<form id="uploadForm" onsubmit="return false;">


<div class="mb-3">

<label class="form-label">
Select Resume
</label>


<input
type="file"
class="form-control"
id="resume"
accept=".pdf,.doc,.docx"
required>

</div>



<button
id="uploadBtn"
type="button"
class="btn btn-success w-100">

<i class="fa-solid fa-cloud-arrow-up"></i>
Upload Resume

</button>


</form>


<div id="message" class="mt-4"></div>


</div>

</div>


</div>

</div>

</div>



<script>


const API_URL = "http://127.0.0.1:5000";


const uploadBtn = document.getElementById("uploadBtn");
const message = document.getElementById("message");


console.log("Upload Page Loaded");



uploadBtn.addEventListener("click", async function(){


const file = document.getElementById("resume").files[0];


if(!file){

message.innerHTML = `
<div class="alert alert-danger">
Please select a resume.
</div>`;

return;

}



uploadBtn.disabled = true;


uploadBtn.innerHTML = `
<span class="spinner-border spinner-border-sm"></span>
Uploading...
`;



const formData = new FormData();

formData.append("resume",file);



try{


console.log("Sending Resume...");



const response = await fetch(API_URL + "/upload",{

method:"POST",

body:formData

});



console.log("Status :",response.status);



const result = await response.json();



console.log("Backend Response :",result);



if(response.status === 200 && result.success){

    localStorage.setItem(
        "candidate",
        JSON.stringify(result.candidate)
    );

    localStorage.setItem(
        "ai",
        result.ai_analysis
    );


    console.log("Candidate Saved");
    console.log("AI Saved");


    console.log("Candidate data:",
    localStorage.getItem("candidate"));

    console.log("AI data:",
    localStorage.getItem("ai"));


    message.innerHTML = `
    <div class="alert alert-success">
    Resume uploaded successfully.<br>
    Opening candidate profile...
    </div>
    `;


    console.log("Redirecting to candidate page...");


    window.location.href =
    "http://127.0.0.1:5500/Recruitflow/frontend/candidate.html";

}

else{


message.innerHTML = `

<div class="alert alert-danger">

${result.message}

</div>

`;



uploadBtn.disabled=false;


uploadBtn.innerHTML = `
<i class="fa-solid fa-cloud-arrow-up"></i>
Upload Resume
`;

}


}


catch(error){


console.error("Upload Error:",error);



message.innerHTML = `

<div class="alert alert-danger">

Cannot connect to backend server.

</div>

`;



uploadBtn.disabled=false;


uploadBtn.innerHTML = `
<i class="fa-solid fa-cloud-arrow-up"></i>
Upload Resume
`;

}


});



</script>


</body>

</html>
