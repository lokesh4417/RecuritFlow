<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecruitFlow Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

                <i class="fa-solid fa-user-tie"></i>

                RecruitFlow Dashboard

            </a>

        </div>

    </nav>

    <div class="container mt-4">

        <!-- Dashboard Cards -->

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow border-0">

                    <div class="card-body text-center">

                        <i class="fa-solid fa-users fa-2x text-primary mb-3"></i>

                        <h5>Total Candidates</h5>

                        <h2 id="candidateCount">0</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow border-0">

                    <div class="card-body text-center">

                        <i class="fa-solid fa-file fa-2x text-success mb-3"></i>

                        <h5>Total Resumes</h5>

                        <h2 id="resumeCount">0</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow border-0">

                    <div class="card-body text-center">

                        <i class="fa-solid fa-robot fa-2x text-warning mb-3"></i>

                        <h5>AI Status</h5>

                        <h2 class="text-success">Active</h2>

                    </div>

                </div>

            </div>

        </div>

        <!-- Candidate Table -->

        <div class="card shadow mt-4">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">

                    <i class="fa-solid fa-address-card"></i>

                    Candidate List

                </h4>

            </div>

            <div class="card-body">

                <div class="row mb-3">

                    <div class="col-md-8">

                        <input
                            type="text"
                            id="searchBox"
                            class="form-control"
                            placeholder="Search Candidate by Name, Email or Skills">

                    </div>

                    <div class="col-md-2">

                        <button
                            class="btn btn-primary w-100"
                            onclick="searchCandidates()">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            Search

                        </button>

                    </div>

                    <div class="col-md-2">

                        <button
                            class="btn btn-secondary w-100"
                            onclick="loadDashboard()">

                            Reset

                        </button>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle">

                        <thead class="table-primary">

                           <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Skills</th>
    <th>Action</th>
</tr>

                        </thead>

                        <tbody id="candidateTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Charts -->

        <div class="row mt-4">

            <div class="col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-success text-white">

                        <h5 class="mb-0">

                            Skills Distribution

                        </h5>

                    </div>

                    <div class="card-body">

                        <canvas id="skillsChart"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-info text-white">

                        <h5 class="mb-0">

                            Candidates Overview

                        </h5>

                    </div>

                    <div class="card-body">

                        <canvas id="candidateChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
